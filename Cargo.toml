[workspace]
resolver = "2"
members = ["crates/nether-core", "crates/tauri-plugin-nethervpn", "src-tauri"]
# Vendored Aether checkout must resolve its own workspace (it has no
# [workspace] table and would otherwise be adopted by this one).
exclude = ["third_party"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net", "io-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 1
