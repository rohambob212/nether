name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64

      # BoringSSL cross-compile (boring-sys) reads ANDROID_NDK_HOME.
      - name: Export NDK paths
        run: |
          NDK="$(ls -d "$ANDROID_HOME"/ndk/* | head -1)"
          for v in ANDROID_NDK_HOME ANDROID_NDK_ROOT NDK_HOME; do
            echo "$v=$NDK" >> "$GITHUB_ENV"
          done

      - name: Fetch Aether sources
        run: ./scripts/setup-deps.sh

      - run: npm ci

      # No gen/android in the repo; the template is generated per build so it
      # can't drift. Runners ship JDK + SDK, nothing needed locally.
      - name: Generate android project
        run: npm run tauri android init

      # Stamp the pixel-portal launcher icon into the freshly generated
      # android res/ (tauri icon writes the mipmaps when gen/android exists).
      - name: Apply launcher icon
        run: npm run tauri icon icons/nether-1024.png

      - name: Build signed APKs (arm64 + armv7)
        run: |
          keytool -genkeypair -v \
            -keystore ci.jks -storepass nether-ci \
            -alias nether -keypass nether-ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Nether CI, OU=Nether, O=Nether, L=Internet, C=US"
          # Consumed by the generated app/build.gradle.kts release signingConfig.
          printf 'storeFile=%s/ci.jks\nstorePassword=nether-ci\nkeyAlias=nether\nkeyPassword=nether-ci\n' \
            "$GITHUB_WORKSPACE" > src-tauri/gen/android/keystore.properties
          npm run tauri android build -- --apk --target aarch64 --target armv7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nether-android-arm64
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
