name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64

      # BoringSSL cross-compile (boring-sys) reads ANDROID_NDK_HOME.
      - name: Export NDK paths
        run: |
          NDK="$(ls -d "$ANDROID_HOME"/ndk/* | head -1)"
          for v in ANDROID_NDK_HOME ANDROID_NDK_ROOT NDK_HOME; do
            echo "$v=$NDK" >> "$GITHUB_ENV"
          done

      - name: Fetch Aether sources
        run: ./scripts/setup-deps.sh

      - run: npm ci

      # No gen/android in the repo; the template is generated per build so it
      # can't drift. Runners ship JDK + SDK, nothing needed locally.
      - name: Generate android project
        run: npm run tauri android init

      - name: Build signed APK
        env:
          TAURI_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/ci.jks
          TAURI_ANDROID_KEYSTORE_PASSWORD: nether-ci
          TAURI_ANDROID_KEY_ALIAS: nether
          TAURI_ANDROID_KEY_PASSWORD: nether-ci
        run: |
          keytool -genkeypair -v \
            -keystore ci.jks -storepass nether-ci \
            -alias nether -keypass nether-ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Nether CI, OU=Nether, O=Nether, L=Internet, C=US"
          npm run tauri android build -- --apk --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nether-android-arm64
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
