[package]
name = "nether-core"
description = "Engine, settings and logging core for Nether, the Aether GUI client"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["engine-aether"]
# Link Aether as an in-process Rust library. Requires third_party/Aether to be
# cloned next to this workspace (see scripts/setup-deps.sh) plus a C/C++
# toolchain with CMake and Go for BoringSSL.
engine-aether = ["dep:aether", "tokio/rt-multi-thread"]
# Simulated engine for UI development without the heavy native toolchain.
engine-mock = []
# Device-wide VPN (tun2socks). Unix only; Android is the real consumer.
vpn = ["dep:ipstack", "dep:libc", "tokio/macros"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dependencies]
aether = { path = "../../third_party/Aether/aether", optional = true }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util"] }

[target.'cfg(unix)'.dependencies]
ipstack = { version = "1", optional = true }
libc = { version = "0.2", optional = true }
